
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1B365D">
  <title>G &amp; Y Services Loan Tracker</title>
  <style>
    :root {
      --navy: #1B365D;
      --green: #00B050;
      --bg: #f3f6fa;
      --surface: #fff;
      --text: #1d2939;
      --muted: #667085;
      --line: #e4eaf1;
      --radius: 16px;
    }
 
    * { box-sizing: border-box; }
 
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
    }
 
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .hidden { display: none !important; }
 
    .sensitive-note {
      background: #fff8e8;
      border: 1px solid #f1d49a;
      color: #795400;
      border-radius: 10px;
      padding: 11px 13px;
      font-size: 12px;
      line-height: 1.5;
      margin-bottom: 14px;
    }
    .sensitive-actions { margin-top: 10px; }
    .sensitive-value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      overflow-wrap: anywhere;
      font-weight: 700;
    }
 
 
    .auth-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
    }
 
    .auth-card {
      width: min(100%, 430px);
      background: white;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: 0 8px 26px #1b365d12;
      padding: 34px;
    }
 
    .brand-mark, .mini-mark, .about-logo {
      display: grid;
      place-items: center;
      color: white;
      background: var(--navy);
      font-weight: 800;
    }
 
    .brand-mark {
      width: 52px;
      height: 52px;
      border-radius: 15px;
    }
 
    .auth-card h1 { color: var(--navy); font-size: 23px; }
    .sub, .muted { color: var(--muted); }
    .sub { font-size: 14px; line-height: 1.5; }
 
    .stack { display: grid; gap: 15px; }
 
    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
      min-width: 0;
    }
 
    label {
      font-size: 12px;
      color: #475467;
      font-weight: 700;
    }
 
    input, select, textarea {
      width: 100%;
      border: 1px solid #d7dee8;
      background: white;
      border-radius: 10px;
      padding: 11px 12px;
      outline: none;
    }
 
    input:focus, select:focus, textarea:focus {
      border-color: #6a8bb8;
      box-shadow: 0 0 0 3px #1b365d19;
    }
 
    textarea { resize: vertical; min-height: 76px; }
 
    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      font-weight: 700;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
 
    .primary { background: var(--navy); color: white; }
    .success { background: var(--green); color: white; }
    .secondary { background: #edf2f8; color: var(--navy); }
    .danger { background: #fff0f0; color: #b42318; }
    .small { padding: 7px 10px; font-size: 12px; }
 
    .text-btn {
      background: none;
      color: var(--navy);
      border: 0;
      padding: 8px;
      font-weight: 700;
    }
 
    .auth-switch {
      text-align: center;
      margin-top: 15px;
      color: var(--muted);
      font-size: 13px;
    }
 
    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--navy);
      color: white;
      padding: 13px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      box-shadow: 0 3px 15px #0d233f30;
    }
 
    .top-brand { display: flex; align-items: center; gap: 12px; }
    .mini-mark {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: #ffffff24;
    }
 
    .top-brand strong { display: block; font-size: 14px; }
    .top-brand span { display: block; color: #c9d5e5; font-size: 11px; }
 
    .top-right { display: flex; align-items: center; gap: 12px; }
    .user-email {
      font-size: 12px;
      color: #d9e3f0;
      max-width: 230px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
 
    .logout {
      background: #ffffff20;
      color: white;
      border: 1px solid #ffffff30;
      border-radius: 9px;
      padding: 8px 11px;
      font-size: 12px;
      font-weight: 700;
    }
 
    .main {
      max-width: 1240px;
      margin: auto;
      padding: 28px 22px 105px;
    }
 
    .page-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 22px;
    }
 
    .page-heading h2 {
      margin: 0;
      color: var(--navy);
      font-size: 25px;
    }
 
    .page-heading p { color: var(--muted); font-size: 13px; }
 
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 14px;
    }
 
    .stat-card, .panel, .loan-card, .payment-card {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 3px 12px #1b365d08;
    }
 
    .stat-card { padding: 18px; min-height: 112px; }
    .stat-label { color: var(--muted); font-size: 12px; font-weight: 650; }
    .stat-value {
      color: var(--navy);
      font-size: 22px;
      font-weight: 800;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }
 
    .stat-value.money { font-size: 19px; }
 
    .dashboard-lower {
      display: grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 16px;
      margin-top: 17px;
    }
 
    .panel { padding: 20px; }
    .panel h3 { color: var(--navy); margin: 0 0 16px; font-size: 15px; }
 
    .breakdown { display: grid; gap: 13px; }
    .break-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
 
    .break-left { display: flex; align-items: center; gap: 9px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    .break-count { font-weight: 800; color: var(--navy); }
 
    .list-toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .search { max-width: 320px; }
 
    .loan-grid, .payment-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 15px;
    }
 
    .loan-card, .payment-card { padding: 18px; min-width: 0; }
    .card-top { display: flex; justify-content: space-between; gap: 12px; }
    .loan-id { font-size: 11px; color: var(--muted); font-weight: 800; }
    .borrower { font-size: 17px; font-weight: 800; color: var(--navy); margin: 4px 0; }
 
    .badge {
      display: inline-flex;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
    }
 
    .status-active { color: #087443; background: #dff7eb; }
    .status-paid { color: #175cd3; background: #e5efff; }
    .status-overdue { color: #9a6700; background: #fff2cc; }
    .status-defaulted { color: #b42318; background: #fee4e2; }
    .status-long { color: white; background: #7a271a; }
 
    .loan-metrics {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 11px;
      margin: 17px 0;
      padding: 13px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
 
    .metric-label { color: var(--muted); font-size: 10px; margin-bottom: 4px; }
    .metric-value { font-size: 13px; font-weight: 750; overflow-wrap: anywhere; }
    .card-meta { color: var(--muted); font-size: 11px; line-height: 1.8; }
    .card-actions { display: flex; justify-content: flex-end; gap: 7px; margin-top: 13px; }
 
    .empty {
      grid-column: 1/-1;
      text-align: center;
      padding: 48px 20px;
      border: 1px dashed #cbd5e1;
      border-radius: var(--radius);
      color: var(--muted);
    }
 
    .empty strong { display: block; color: var(--navy); margin-bottom: 6px; }
 
    .payment-card h4 { margin: 6px 0; color: var(--navy); font-size: 15px; }
    .payment-amount { font-size: 20px; color: var(--green); font-weight: 850; margin: 12px 0 5px; }
 
    .about-card { max-width: 760px; line-height: 1.7; }
    .about-logo {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      font-size: 20px;
    }
 
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background: #09182b90;
      padding: 16px;
    }
 
    .modal {
      width: min(100%, 850px);
      max-height: 92vh;
      overflow: auto;
      background: white;
      border-radius: 18px;
    }
 
    .modal.narrow { max-width: 560px; }
    .modal-head, .modal-foot { padding: 19px 22px; border-bottom: 1px solid var(--line); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; }
    .modal-head h3 { color: var(--navy); margin: 0; }
    .close { border: 0; background: #f1f4f8; border-radius: 9px; width: 33px; height: 33px; font-size: 21px; }
    .modal-body { padding: 22px; }
    .form-section { margin-bottom: 23px; }
    .form-section h4 { color: var(--navy); font-size: 13px; text-transform: uppercase; }
    .form-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 13px; }
    .preview-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 9px; }
    .preview-item { background: #eff7f2; border-radius: 10px; padding: 12px; }
    .preview-item span { display: block; color: #547261; font-size: 10px; }
    .preview-item strong { display: block; color: #087443; margin-top: 5px; font-size: 14px; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 9px; border-top: 1px solid var(--line); border-bottom: 0; }
 
    .toast-wrap { position: fixed; z-index: 100; right: 18px; top: 18px; display: grid; gap: 8px; width: min(360px, calc(100vw - 36px)); }
    .toast { background: #102a48; color: white; border-radius: 11px; padding: 13px 15px; font-size: 13px; }
    .toast.error { background: #a62922; }
    .toast.success-toast { background: #087443; }
 
    .spinner, .loader {
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
 
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid #ffffff60;
      border-top-color: white;
    }
 
    .loader {
      width: 30px;
      height: 30px;
      border: 3px solid #d8e2ed;
      border-top-color: var(--green);
      margin: 0 auto 12px;
    }
 
    @keyframes spin { to { transform: rotate(360deg); } }
 
    .bottom-nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 24px;
      background: #fff;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 8px #1b365d0a;
    }
    .nav-item {
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #667085;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .nav-icon { font-size: 16px; }
    .nav-item:hover { background: #f3f6fa; color: var(--navy); }
    .nav-item.active { color: var(--navy); background: #eaf0f8; }
 
    .loading-cover {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      background: #f3f6facc;
      color: var(--navy);
      font-weight: 700;
    }
 
    @media(max-width:900px) {
      .stats-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .dashboard-lower { grid-template-columns: 1fr; }
    }
 
    @media(max-width:640px) {
      .topbar { padding: 11px 14px; }
      .user-email { display: none; }
      .main { padding: 22px 14px 100px; }
      .stats-grid { gap: 9px; }
      .stat-card { padding: 13px; min-height: 94px; }
      .stat-value { font-size: 19px; }
      .stat-value.money { font-size: 15px; }
      .loan-grid, .payment-grid { grid-template-columns: 1fr; }
      .list-toolbar { flex-direction: column; align-items: stretch; }
      .search { max-width: none; }
      .bottom-nav {
        position: fixed;
        z-index: 25;
        bottom: 0;
        left: 0;
        right: 0;
        display: grid;
        grid-template-columns: repeat(4,1fr);
        padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
        background: white;
        border-top: 1px solid var(--line);
      }
      .nav-item {
        border: 0;
        background: transparent;
        color: #758196;
        display: grid;
        justify-items: center;
        gap: 4px;
        padding: 5px 2px;
        font-size: 10px;
        font-weight: 700;
      }
      .nav-icon { font-size: 19px; }
      .nav-item.active { color: var(--navy); }
      .form-grid, .preview-grid { grid-template-columns: 1fr; }
      .modal-backdrop { padding: 0; align-items: end; }
      .modal { width: 100%; max-height: 94vh; border-radius: 18px 18px 0 0; }
      .modal-body { padding: 18px 16px; }
    }
  </style>
</head>
<body>
 
<section id="authScreen" class="auth-screen">
  <div class="auth-card">
    <div class="brand-mark">G&amp;Y</div>
    <h1>G &amp; Y Services</h1>
    <p class="sub">G &amp; Y Services Loan Tracker<br>Secure loan and repayment management.</p>
    <form id="authForm" class="stack">
      <div class="field">
        <label for="authPassword">ADMIN PASSWORD</label>
        <input id="authPassword" type="password" minlength="6" required autocomplete="current-password" placeholder="Enter administrator password">
      </div>
      <button id="authSubmit" class="btn primary" type="submit">Unlock Dashboard</button>
    </form>
    <p class="auth-switch">Administrator access only. Registration is disabled.</p>
  </div>
</section>
 
<div id="appShell" class="hidden">
  <header class="topbar">
    <div class="top-brand">
      <div class="mini-mark">G&amp;Y</div>
      <div>
        <strong>G &amp; Y Services</strong>
        <span id="pageSubTitle">Loan Tracker · Dashboard</span>
      </div>
    </div>
    <div class="top-right">
      <span id="userEmail" class="user-email"></span>
      <button id="logoutBtn" class="logout" type="button">Log out ↗</button>
    </div>
  </header>
 
  <main id="mainContent" class="main"></main>
 
  <nav class="bottom-nav">
    <button class="nav-item active" data-page="dashboard"><span class="nav-icon">▦</span>Dashboard</button>
    <button class="nav-item" data-page="loans"><span class="nav-icon">▤</span>Loans</button>
    <button class="nav-item" data-page="payments"><span class="nav-icon">₦</span>Payments</button>
    <button class="nav-item" data-page="about"><span class="nav-icon">ⓘ</span>About</button>
  </nav>
</div>
 
<div id="modalRoot"></div>
<div id="toastWrap" class="toast-wrap"></div>
<div id="loadingCover" class="loading-cover hidden">
  <div style="text-align:center"><div class="loader"></div>Loading your workspace…</div>
</div>
 
<script type="module">
  const firebaseConfig = {
    apiKey: "AIzaSyBJAcMa_No2uPAVX6WAfoloJLW9NL00CFU",
    authDomain: "loan-tracker-ae810.firebaseapp.com",
    projectId: "loan-tracker-ae810",
    storageBucket: "loan-tracker-ae810.firebasestorage.app",
    messagingSenderId: "370042396796",
    appId: "1:370042396796:web:a40fbba9343e0fcd45e9f9",
    measurementId: "G-J42CTFGC28"
  };
  // Password is entered privately at login and is not stored in this file.
  const ADMIN_EMAIL = "gyservices55@gmail.com";
  const ADMIN_UID = "4MlYoMQN3JT77zBl42lyYhxI5Mg1";
 
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import {
    getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut,
    EmailAuthProvider, reauthenticateWithCredential
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
 
  import {
    getFirestore, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, getDoc,
    onSnapshot, query, orderBy, runTransaction, serverTimestamp, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
 
  const $ = id => document.getElementById(id);
 
  const money = value => "₦" + Number(value || 0).toLocaleString("en-NG", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
 
  const number = value => Number(value || 0);
 
  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  })[c]);
 
  const dateText = value => value
    ? new Date(value + (String(value).length === 10 ? "T00:00:00" : "")).toLocaleDateString("en-NG")
    : "—";
 
  const statuses = ["Active","Fully Paid","Overdue","Defaulted","Long Overdue"];
 
  const statusClass = status => ({
    "Active":"status-active",
    "Fully Paid":"status-paid",
    "Overdue":"status-overdue",
    "Defaulted":"status-defaulted",
    "Long Overdue":"status-long"
  }[status] || "status-active");
 
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
 
  let currentUser = null;
  let currentPage = "dashboard";
  let loans = [];
  let payments = [];
  let unsubLoans = null;
  let unsubPayments = null;
  const migratedLegacyLoanIds = new Set();
 
  const userCollection = name =>
    collection(db, "users", currentUser.uid, name);
 
  const userDoc = (name, id) =>
    doc(db, "users", currentUser.uid, name, id);
 
  // Highly sensitive identity/banking fields live in a separate collection.
  // They are never included in ordinary loan cards or dashboard summaries.
  const sensitiveFields = ["nin", "bvn", "accountNoBank", "guarantorNin"];
  const sensitiveDoc = id => doc(db, "users", currentUser.uid, "sensitiveLoans", id);
 
  function masked(value) {
    const raw = String(value || "").trim();
    if (!raw) return "Not provided";
    if (raw.length <= 4) return "••••";
    return "••••••" + raw.slice(-4);
  }
 
  async function confirmAdminPassword() {
    const password = prompt("For your protection, re-enter the administrator password to reveal sensitive details:");
    if (password === null) return false;
    if (!password.trim()) {
      showToast("Password is required to reveal sensitive details.", "error");
      return false;
    }
    try {
      const credential = EmailAuthProvider.credential(ADMIN_EMAIL, password);
      await reauthenticateWithCredential(auth.currentUser, credential);
      return true;
    } catch (error) {
      showToast("Password confirmation failed. Sensitive details remain hidden.", "error");
      return false;
    }
  }
 
  async function viewSensitiveDetails(loanId) {
    const loan = loans.find(item => item.id === loanId);
    if (!loan) return;
    if (!(await confirmAdminPassword())) return;
 
    try {
      const snap = await getDoc(sensitiveDoc(loanId));
      const saved = snap.exists() ? snap.data() : {};
      // Legacy records may still have these values on the original loan document.
      const values = {};
      sensitiveFields.forEach(key => values[key] = saved[key] || loan[key] || "");
      const labels = {
        nin: "Borrower NIN",
        bvn: "Borrower BVN",
        accountNoBank: "Account Number / Bank",
        guarantorNin: "Guarantor NIN"
      };
      const rows = sensitiveFields.map(key => `
        <div class="break-row">
          <span>${labels[key]}</span>
          <strong class="sensitive-value">${esc(values[key] || "Not provided")}</strong>
        </div>`).join("");
 
      $("modalRoot").innerHTML = `
        <div class="modal-backdrop" id="modalBackdrop">
          <section class="modal narrow" role="dialog" aria-modal="true">
            <div class="modal-head">
              <h3>Protected details · Loan #${esc(loan.loanNumber || "—")}</h3>
              <button class="close" type="button" data-close-modal>×</button>
            </div>
            <div class="modal-body">
              <div class="sensitive-note">These details are confidential. Do not share screenshots or leave this screen visible to others.</div>
              <div class="breakdown">${rows}</div>
            </div>
            <div class="modal-foot">
              <button class="btn primary" type="button" data-close-modal>Close</button>
            </div>
          </section>
        </div>`;
      bindModalClose();
    } catch (error) {
      showToast(friendlyError(error), "error");
    }
  }
 
  function showToast(message, type = "success-toast") {
    const el = document.createElement("div");
    el.className = "toast " + type;
    el.textContent = message;
    $("toastWrap").appendChild(el);
    setTimeout(() => el.remove(), 3600);
  }
 
  function setBusy(button, busy, label = "Saving…") {
    if (!button) return;
    if (busy) {
      button.dataset.oldText = button.innerHTML;
      button.disabled = true;
      button.innerHTML = '<span class="spinner"></span>' + label;
    } else {
      button.disabled = false;
      button.innerHTML = button.dataset.oldText || "Save";
    }
  }
 
  function calcLoan(principal, rate, duration) {
    const interest = principal * (rate / 100) * duration;
    const payable = principal + interest;
    return {
      interest,
      payable,
      monthly: duration > 0 ? payable / duration : 0
    };
  }
 
  function paidFor(loanId) {
    return payments
      .filter(p => p.loanId === loanId)
      .reduce((sum,p) => sum + number(p.amount), 0);
  }
 
  function outstandingFor(loan) {
    return Math.max(0, number(loan.totalPayable) - paidFor(loan.id));
  }
 
  function effectiveStatus(loan) {
    if (paidFor(loan.id) >= number(loan.totalPayable) && number(loan.totalPayable) > 0) {
      return "Fully Paid";
    }
    return loan.status === "Fully Paid"
      ? (loan.statusBeforePaid || "Active")
      : (loan.status || "Active");
  }
 
  function friendlyError(error) {
    const messages = {
      "auth/email-already-in-use":"This email already has an account.",
      "auth/invalid-credential":"Email or password is incorrect.",
      "auth/weak-password":"Password must contain at least 6 characters.",
      "auth/invalid-email":"Please enter a valid email address.",
      "auth/network-request-failed":"Check your internet connection.",
      "permission-denied":"Access denied. Check your Firestore security rules."
    };
 
    return messages[error?.code] || error?.message || "Something went wrong.";
  }
 
  function stopListeners() {
    if (unsubLoans) unsubLoans();

  async function migrateLegacySensitiveRecords(documents) {
    for (const loanSnap of documents) {
      const legacy = loanSnap.data();
      const hasLegacySensitive = sensitiveFields.some(key =>
        Object.prototype.hasOwnProperty.call(legacy, key) && legacy[key]
      );
      if (!hasLegacySensitive || migratedLegacyLoanIds.has(loanSnap.id)) continue;
 
      migratedLegacyLoanIds.add(loanSnap.id);
      const protectedData = {};
      const cleanup = {};
      sensitiveFields.forEach(key => {
        if (Object.prototype.hasOwnProperty.call(legacy, key)) {
          protectedData[key] = legacy[key] || "";
          cleanup[key] = deleteField();
        }
      });
 
      try {
        await setDoc(sensitiveDoc(loanSnap.id), {
          ...protectedData,
          migratedAt: serverTimestamp(),
          updatedAt: serverTimestamp()
        }, {merge:true});
        await updateDoc(userDoc("loans", loanSnap.id), cleanup);
      } catch (error) {
        migratedLegacyLoanIds.delete(loanSnap.id);
        showToast("A legacy protected record could not be moved. Check Firestore permissions and try again.", "error");
      }
    }
  }
 
  function startListeners() {
    stopListeners();

    unsubLoans = onSnapshot(
      query(userCollection("loans"), orderBy("createdAt","desc")),
      snap => {
        loans = snap.docs.map(d => ({id:d.id,...d.data()}));
        render();
        $("loadingCover").classList.add("hidden");
        migrateLegacySensitiveRecords(snap.docs);
      },
      error => {
        $("loadingCover").classList.add("hidden");
        showToast(friendlyError(error),"error");
      }
    );
 
    unsubPayments = onSnapshot(
      query(userCollection("payments"), orderBy("date","desc")),
      snap => {
        payments = snap.docs.map(d => ({id:d.id,...d.data()}));
        render();
      },
      error => showToast(friendlyError(error),"error")
    );
  }

  function inputField(field,value="") {
    const [name,label,required,type,options]=field;
    let control;
 
    if(type==="select") {
      control=`<select id="f_${name}">
        <option value="">Select…</option>
        ${options.map(o=>`<option ${value===o?"selected":""}>${o}</option>`).join("")}
      </select>`;
    } else {
      control=`<input id="f_${name}" type="${type||"text"}"
        ${required?"required":""} value="${esc(value)}">`;
    }
 
    return `<div class="field">
      <label for="f_${name}">${label}${required?' <span style="color:red">*</span>':""}</label>
      ${control}
    </div>`;
  }

  async function openLoanModal(loan=null) {
    const editing=!!loan;
    let protectedValues = {};
    if (editing && !(await confirmAdminPassword())) return;
    if (editing) {
      try {
        const protectedSnap = await getDoc(sensitiveDoc(loan.id));
        if (protectedSnap.exists()) protectedValues = protectedSnap.data();
      } catch (error) {
        showToast("Could not load protected details: " + friendlyError(error), "error");
      }
      // Support older records that pre-date the separate protected collection.
      sensitiveFields.forEach(key => {
        if (!protectedValues[key] && loan[key]) protectedValues[key] = loan[key];
      });
    }
 
    const borrowerFields=loanFields.slice(0,10)
      .map(f=>inputField(f, sensitiveFields.includes(f[0]) ? (protectedValues[f[0]] || "") : (loan?.[f[0]]||""))).join("");
 
    const guarantorFields=loanFields.slice(10,15)
      .map(f=>inputField(f, sensitiveFields.includes(f[0]) ? (protectedValues[f[0]] || "") : (loan?.[f[0]]||""))).join("");
    const recordFields=loanFields.slice(15)
      .map(f=>inputField(f,loan?.[f[0]]||"")).join("");
 
    $("modalRoot").innerHTML=`
      <div class="modal-backdrop" id="modalBackdrop">
        <section class="modal" role="dialog" aria-modal="true">
          <div class="modal-head">
            <h3>${editing?"Edit Loan":"Create New Loan"}</h3>
            <button class="close" type="button" data-close-modal>×</button>
          </div>
 
          <form id="loanForm">
            <div class="modal-body">
              <div class="sensitive-note">Privacy protection: NIN, BVN, account details and guarantor NIN are saved in a separate protected Firestore collection. They are not shown on loan cards and require your admin password to reveal.</div>
              <div class="form-section">

              </div>
 
              <div class="form-section">
                <h4>Guarantor details</h4>
                <div class="form-grid">${guarantorFields}</div>
              </div>
 
              <div class="form-section">
                <h4>Loan record details</h4>
                <div class="form-grid">${recordFields}</div>
              </div>
 
              <div class="form-section">
                <h4>Loan computation</h4>
                <div class="form-grid">
                  <div class="field">
                    <label>Principal (₦) *</label>
                    <input id="f_principal" type="number" min=".01" step=".01" required value="${editing?number(loan.principal):""}">
                  </div>
                  <div class="field">
                    <label>Interest Rate (%) *</label>
                    <input id="f_rate" type="number" min="0" step=".01" required value="${editing?number(loan.rate):20}">
                  </div>
                  <div class="field">
                    <label>Duration (Months) *</label>
                    <input id="f_duration" type="number" min="1" step="1" required value="${editing?number(loan.duration):5}">
                  </div>
                  <div class="field">
                    <label>Status</label>
                    <select id="f_status">
                      ${statuses.map(s=>`<option ${((loan?.status||"Active")===s)?"selected":""}>${s}</option>`).join("")}
                    </select>
                  </div>
                </div>
 
                <p><strong>Live calculation preview</strong></p>
                <div class="preview-grid">
                  <div class="preview-item"><span>Total Interest</span><strong id="previewInterest"></strong></div>
                  <div class="preview-item"><span>Total Payable</span><strong id="previewPayable"></strong></div>
                  <div class="preview-item"><span>Monthly Repayment</span><strong id="previewMonthly"></strong></div>
                </div>
              </div>
            </div>
 
            <div class="modal-foot">
              <button class="btn secondary" type="button" data-close-modal>Cancel</button>
              <button id="saveLoanBtn" class="btn primary" type="submit">${editing?"Save Changes":"Save Loan"}</button>
            </div>
          </form>
        </section>
      </div>`;
 
    const updatePreview=()=>{
      const c=calcLoan(
        number($("f_principal").value),
        number($("f_rate").value),
        number($("f_duration").value)
      );
 
      $("previewInterest").textContent=money(c.interest);
      $("previewPayable").textContent=money(c.payable);
      $("previewMonthly").textContent=money(c.monthly);
    };
 
    ["f_principal","f_rate","f_duration"].forEach(id=>{
      $(id).addEventListener("input",updatePreview);
    });
 
    updatePreview();
    bindModalClose();
 
    $("loanForm").addEventListener("submit",async event=>{
      event.preventDefault();
 
      const button=$("saveLoanBtn");
      setBusy(button,true,"Saving loan…");
 
      try {
        const principal=number($("f_principal").value);
        const rate=number($("f_rate").value);
        const duration=number($("f_duration").value);
 
        if(principal<=0 || rate<0 || duration<1 || !Number.isInteger(duration)) {
          throw new Error("Enter a valid principal, interest rate and whole-number duration.");
        }
 
        const c=calcLoan(principal,rate,duration);
        const data={};
        const protectedData={};
 
        loanFields.forEach(f=>{
          const value=$("f_"+f[0]).value.trim();
          if (sensitiveFields.includes(f[0])) protectedData[f[0]]=value;
          else data[f[0]]=value;
        });
 
        data.principal=principal;
        data.rate=rate;
        data.duration=duration;
        data.totalInterest=c.interest;
        data.totalPayable=c.payable;
        data.monthlyRepayment=c.monthly;
        data.status=$("f_status").value;
        data.updatedAt=serverTimestamp();
 
        if(editing) {
          await setDoc(sensitiveDoc(loan.id), {
            ...protectedData,
            updatedAt: serverTimestamp()
          }, {merge:true});
          sensitiveFields.forEach(key => data[key]=deleteField());
          await updateDoc(userDoc("loans",loan.id),data);
          showToast("Loan updated. Protected details saved separately.");
        } else {
          const counterRef=doc(db,"users",currentUser.uid,"meta","loanCounter");
 
          const loanNumber=await runTransaction(db,async tx=>{
            const snap=await tx.get(counterRef);
            const next=(snap.exists()?number(snap.data().value):0)+1;
 
            tx.set(counterRef,{
              value:next,
              updatedAt:serverTimestamp()
            });
 
            return String(next).padStart(3,"0");
          });
 
          const newLoanRef = await addDoc(userCollection("loans"),{
            ...data,
            loanNumber,
            createdAt:serverTimestamp()
          });
          await setDoc(sensitiveDoc(newLoanRef.id), {
            ...protectedData,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          });
 
          showToast("Loan created: "+loanNumber);
        }
 
        closeModal();
      } catch(error) {
        showToast(friendlyError(error),"error");
      } finally {
        setBusy(button,false);
      }
    });
  }
 
  async function deleteLoan(id) {
    const loan=loans.find(l=>l.id===id);
    if(!loan) return;
 
    if(!confirm(`Delete loan #${loan.loanNumber} for ${loan.fullName}? This also deletes its payments and protected details. This action cannot be undone.`)) return;
 
    // Require administrator password re-entry immediately before deletion.
    if (!(await confirmAdminPassword())) return;
 
    try {
      const linked=payments.filter(p=>p.loanId===id);
 
      for(const payment of linked) {
        await deleteDoc(userDoc("payments",payment.id));
      }
 
      await deleteDoc(userDoc("loans",id));
      await deleteDoc(sensitiveDoc(id));
      showToast("Loan, protected details and linked payments deleted.");
    } catch(error) {
      showToast(friendlyError(error),"error");
    }
  }

              <div class="field"><label>NOTES</label><textarea id="p_notes"></textarea></div>
            </div>
 
            <div class="modal-foot">
              <button class="btn secondary" type="button" data-close-modal>Cancel</button>
              <button id="savePaymentBtn" class="btn primary" type="submit">Save Payment</button>
            </div>
          </form>
        </section>
      </div>`;
 
    bindModalClose();
 
    $("paymentForm").addEventListener("submit",async event=>{
      event.preventDefault();
 
      const button=$("savePaymentBtn");
      setBusy(button,true,"Saving payment…");
 
      try {
        const loan=loans.find(l=>l.id===$("p_loan").value);
        const amount=number($("p_amount").value);
 
        if(!loan || amount<=0) throw new Error("Select a loan and enter a valid payment amount.");
 
        await addDoc(userCollection("payments"),{
          loanId:loan.id,
          loanNumber:loan.loanNumber,
          borrowerName:loan.fullName,
          date:$("p_date").value,
          amount,
          method:$("p_method").value,
          monthCovered:$("p_month").value.trim(),
          receivedBy:$("p_received").value.trim(),
          notes:$("p_notes").value.trim(),
          createdAt:serverTimestamp()
        });
 
        if(paidFor(loan.id)+amount>=number(loan.totalPayable)) {
          await updateDoc(userDoc("loans",loan.id),{
            status:"Fully Paid",
            statusBeforePaid:loan.status==="Fully Paid"?(loan.statusBeforePaid||"Active"):loan.status,
            updatedAt:serverTimestamp()
          });
        }
 
        showToast("Payment recorded successfully.");
        closeModal();
      } catch(error) {
        showToast(friendlyError(error),"error");
      } finally {
        setBusy(button,false);
      }
    });
  }
 
  async function deletePayment(id) {
    const payment=payments.find(p=>p.id===id);
    if(!payment) return;
 
    if(!confirm(`Delete this ${money(payment.amount)} payment?`)) return;
 
    try {
      await deleteDoc(userDoc("payments",id));
 
      const loan=loans.find(l=>l.id===payment.loanId);
 
      if(loan && loan.status==="Fully Paid" &&
        paidFor(loan.id)-number(payment.amount)<number(loan.totalPayable)) {
        await updateDoc(userDoc("loans",loan.id),{
          status:loan.statusBeforePaid||"Active",
          statusBeforePaid:null,
          updatedAt:serverTimestamp()
        });
      }
 
      showToast("Payment deleted.");
    } catch(error) {
      showToast(friendlyError(error),"error");
    }
  }
</script>
